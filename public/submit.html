<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>서류 제출 - 출결패스</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%AB</text></svg>">
</head>
<body>
<div class="wrap narrow">
  <div id="header-area" style="padding-top:24px">
    <p><a href="index.html" style="color:var(--sub); font-size:13px; text-decoration:none">← 홈으로</a></p>
    <h1 id="class-title" class="title-gradient">서류 제출</h1>
    <p class="page-sub">제출할 서류를 선택하고 내용을 입력해주세요.</p>
  </div>

  <div id="loading" class="loading-block">불러오는 중...</div>

  <form id="submit-form" class="card" style="display:none">
    <div class="field">
      <label>제출할 서류 선택 *</label>
      <div class="doctype-picker" id="doctype-picker"></div>
      <select id="f-doctype" required style="display:none"></select>
    </div>
    <div class="field">
      <label>학생 선택 *</label>
      <select id="f-student" required></select>
    </div>

    <div id="section-absence" class="doctype-section">
      <div class="row">
        <div class="field"><label>결석 시작일 *</label><input type="date" class="f-start" /></div>
        <div class="field"><label>결석 종료일 *</label><input type="date" class="f-end" /></div>
      </div>
      <div class="field"><label>일수 (주말 제외 자동 계산, 필요 시 수정) *</label><input type="number" class="f-days" min="0" /></div>
      <div class="field">
        <label>결석 유형 *</label>
        <select id="f-absenceType">
          <option value="">선택하세요</option>
          <option value="출석인정결석">출석인정결석</option>
          <option value="질병결석">질병결석</option>
          <option value="기타결석">기타결석</option>
        </select>
      </div>
      <div class="field" id="subtype-field" style="display:none">
        <label>세부 사유</label>
        <select id="f-subtype"></select>
      </div>
      <div class="field"><label>결석 사유 상세 *</label><textarea id="f-reasonDetail" placeholder="예: 감기 몸살로 인한 통원 치료"></textarea></div>
      <div class="field"><label>보호자 성명 *</label><input type="text" id="f-guardianName" /></div>
      <div class="field"><label>증빙서류 사진 (선택, 진단서·처방전 등)</label><input type="file" id="f-photo" accept="image/*" capture="environment" /></div>
    </div>

    <div id="section-tripApply" class="doctype-section">
      <div class="field"><label>연락처 *</label><input type="text" id="f-contact" placeholder="010-0000-0000" /></div>
      <div class="row">
        <div class="field"><label>체험학습 시작일 *</label><input type="date" class="f-start" /></div>
        <div class="field"><label>체험학습 종료일 *</label><input type="date" class="f-end" /></div>
      </div>
      <div class="field"><label>일수 (주말 제외 자동 계산, 필요 시 수정) *</label><input type="number" class="f-days" min="0" /></div>
      <div class="field"><label>목적 *</label><input type="text" id="f-purpose" placeholder="예: 가족 여행" /></div>
      <div class="field"><label>장소 *</label><input type="text" id="f-location" placeholder="예: 제주도" /></div>
      <div class="field"><label>학습계획 *</label><textarea id="f-studyPlan" placeholder="체험학습 중 어떤 학습을 할 계획인지 적어주세요"></textarea></div>
      <div class="field">
        <label>보호자(친권자·후견인) 동행 여부 *</label>
        <select id="f-accompany"><option value="">선택하세요</option><option value="예">예</option><option value="아니오">아니오</option></select>
      </div>
      <div class="field">
        <label>연속 5일 초과 시, 학생이 담임교사에게 연락하겠습니까? *</label>
        <select id="f-contact5day"><option value="">선택하세요</option><option value="예">예</option><option value="아니오">아니오</option></select>
      </div>
      <div class="field"><label>보호자 성명 *</label><input type="text" id="f-guardianName-apply" /></div>
    </div>

    <div id="section-tripReport" class="doctype-section">
      <div class="row">
        <div class="field"><label>체험학습 시작일 *</label><input type="date" class="f-start" /></div>
        <div class="field"><label>체험학습 종료일 *</label><input type="date" class="f-end" /></div>
      </div>
      <div class="field"><label>일수 (주말 제외 자동 계산, 필요 시 수정) *</label><input type="number" class="f-days" min="0" /></div>
      <div class="field"><label>학습 내용 *</label><textarea id="f-reportContent" rows="8" placeholder="교외체험학습 중 어떤 교육활동을 했는지 구체적으로 적어주세요"></textarea></div>
      <div class="field"><label>보호자 성명 *</label><input type="text" id="f-guardianName-report" /></div>
    </div>

    <div class="field">
      <label>보호자 서명 *</label>
      <div class="sig-pad-wrap"><canvas id="sig-canvas"></canvas></div>
      <button type="button" class="btn btn-ghost btn-sm" id="btn-clear-sig" style="margin-top:8px">서명 지우기</button>
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="btn-submit" style="margin-top:8px">제출하기</button>
  </form>

  <div id="done-screen" class="card" style="display:none; text-align:center">
    <div style="width:76px; height:76px; margin:4px auto 12px; border-radius:50%; background:var(--primary); border:3px solid var(--ink); display:flex; align-items:center; justify-content:center; font-size:36px; box-shadow:4px 4px 0 var(--ink)">✅</div>
    <h2>제출이 완료되었습니다</h2>
    <p class="page-sub">담임 선생님께 서류가 전달되었습니다.</p>
    <a class="btn btn-secondary" id="download-link" download="제출서류.pdf" href="#">제출한 서류 PDF 확인</a>
  </div>

  <div id="error-screen" class="card" style="display:none">
    <p>이 링크가 유효하지 않거나, 담임 선생님이 아직 서류 양식을 등록하지 않았습니다.</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<script type="module" src="js/submit.js"></script>
<script type="module" src="js/footer.js"></script>
</body>
</html>
