<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>서류 수합 - 출결패스</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%AB</text></svg>">
</head>
<body>
<div id="app-nav"></div>
<div class="wrap">
  <h1>기간별 서류 수합</h1>
  <p class="page-sub">기간과 서류 종류를 선택해 제출된 서류를 한 개의 PDF로 합쳐서 교무실에 제출하세요.</p>

  <div class="card">
    <div class="row">
      <div class="field"><label>서류 종류</label>
        <select id="e-doctype">
          <option value="all">전체</option>
          <option value="absence">결석계</option>
          <option value="tripApply">교외체험학습 신청서</option>
          <option value="tripReport">교외체험학습 보고서</option>
        </select>
      </div>
      <div class="field"><label>시작일</label><input type="date" id="e-start" /></div>
      <div class="field"><label>종료일</label><input type="date" id="e-end" /></div>
      <div class="field"><label>정렬 기준</label>
        <select id="e-sort">
          <option value="student">학생순</option>
          <option value="date">날짜순</option>
        </select>
      </div>
    </div>
    <button class="btn btn-primary" id="e-search">조회</button>
  </div>

  <div class="card">
    <h2>조회 결과 (<span id="result-count">0</span>건)</h2>
    <div id="result-list"></div>
    <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap">
      <button class="btn btn-secondary" id="e-merge" disabled>PDF로 합쳐서 다운로드</button>
      <button class="btn btn-danger" id="e-cleanup" disabled>제출 완료 후 파일 정리(삭제)</button>
    </div>
    <p class="hint" style="margin-top:8px">"정리"를 누르면 서명·첨부사진이 담긴 원본 파일이 서버에서 삭제됩니다. 교무실 제출 후에만 눌러주세요.</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js" defer></script>
<script type="module" src="js/export.js"></script>
<script type="module" src="js/footer.js"></script>
</body>
</html>
