<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>결석계 관리</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="wrap narrow">
  <div style="text-align:center; margin-top:56px; margin-bottom:8px; font-size:40px">📋</div>
  <h1 class="title-gradient" style="text-align:center; margin-top:0; font-size:28px">결석계 관리</h1>
  <p class="page-sub" style="text-align:center">학교 서류를 온라인으로 받고 관리하는 서비스입니다.</p>

  <div class="tabbar" id="role-tabbar" style="margin:0 auto 18px; width:100%; justify-content:center">
    <button class="active" data-role="teacher" style="flex:1">👩‍🏫 선생님</button>
    <button data-role="parent" style="flex:1">👨‍👩‍👧 학부모</button>
  </div>

  <div id="role-teacher" class="card">
    <div class="home-icon mint">👩‍🏫</div>
    <h2 style="margin-bottom:4px">선생님이신가요?</h2>
    <p class="page-sub">관리자 번호로 입장해서 학급을 관리하세요.</p>
    <a href="teacher.html" class="btn btn-primary btn-block">관리자 번호로 입장</a>
  </div>

  <div id="role-parent" class="card" style="display:none">
    <div class="home-icon yellow">👨‍👩‍👧</div>
    <h2 style="margin-bottom:4px">학부모이신가요?</h2>
    <p class="page-sub" style="margin-bottom:16px">학급 이름과 비밀번호를 입력해주세요. 담임 선생님께 받은 링크로 바로 오셨다면 이 단계는 건너뛰어도 됩니다.</p>
    <form id="parent-form">
      <div class="field">
        <label>학급 이름</label>
        <input type="text" id="p-classname" placeholder="예: 콩자반" required />
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="p-password" placeholder="담임 선생님께 안내받은 비밀번호" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="p-submit">입장</button>
    </form>
  </div>
</div>

<script type="module" src="js/home.js"></script>
</body>
</html>
